# Builds the Android app (app/) and publishes Kruger.apk as the latest GitHub release.
name: Android app
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npx cap sync android
      - name: Build APK
        working-directory: app/android
        env:
          KC_VERSION_CODE: ${{ github.run_number }}
          KC_VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        working-directory: app/android
        run: |
          grep -nE "error:|^e: |What went wrong|Execution failed|Could not|^> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Publish release
        working-directory: app/android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Kruger.apk
          gh release create "app-${{ github.run_number }}" Kruger.apk \
            --title "Kruger app 1.${{ github.run_number }}" \
            --notes "On the phone: download Kruger.apk, open it, allow installing from this source, Install." \
            --latest
